name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted # Критерий 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: bash
        run: |
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          APP_PORT=${{ secrets.APP_PORT }}
          EOF
          echo ".env file created successfully" # Критерий 3

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          docker compose up -d --build # Критерий 2
          echo "Waiting for services to start..."
          sleep 15
          docker compose ps

      - name: Verify containers are running
        shell: bash
        run: |
          if docker compose ps | grep -q "Up"; then
            echo "All containers are running"
          else
            echo "Some containers failed to start"
            docker compose logs
            exit 1
          fi # Критерий 2

      - name: Run application tests
        shell: bash
        run: |
          echo "1. Testing application and database connectivity..."
          
          API_RESPONSE=$(curl -s http://localhost:${{ secrets.APP_PORT }}/api/items)
          if echo "$API_RESPONSE" | grep -q "first item"; then
            echo "Web application is healthy and returns data from DB"
          else
            echo "Web application API test failed. Response: $API_RESPONSE"
            exit 1
          fi # Критерий 4
          
          echo "2. Testing data consistency..."
          DB_COUNT=$(docker compose exec -T db psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -t -c "SELECT COUNT(*) FROM items;" | tr -d ' ')
          WEB_COUNT=$(echo "$API_RESPONSE" | grep -o '"id"' | wc -l | tr -d ' ')
          
          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"
          
          if [ "$DB_COUNT" -eq "$WEB_COUNT" ]; then
            echo "Data consistency test passed!"
          else
            echo "Data consistency test failed!"
            exit 1
          fi # Критерий 4

      - name: Create test report
        if: always()
        shell: powershell
        run: |
          "# Deployment Test Report" | Out-File -FilePath test-report.md
          "- Application: Healthy" | Out-File -FilePath test-report.md -Append
          "- Database: Connected" | Out-File -FilePath test-report.md -Append
          "- Containers: Running" | Out-File -FilePath test-report.md -Append
          "Data Consistency: Passed" | Out-File -FilePath test-report.md -Append

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
          retention-days: 30 # Критерий 3

      - name: Save Docker logs
        if: always()
        shell: powershell
        run: |
          docker compose logs > deployment-logs.txt

      - name: Upload Docker logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: deployment-logs.txt
          retention-days: 30 # Критерий 3
