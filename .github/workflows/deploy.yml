name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted # Критерий 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: powershell
        run: |
          "DB_USER=${{ secrets.DB_USER }}" | Out-File -FilePath .env -Encoding utf8
          "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | Out-File -FilePath .env -Encoding utf8 -Append
          "DB_NAME=${{ secrets.DB_NAME }}" | Out-File -FilePath .env -Encoding utf8 -Append
          "APP_PORT=${{ secrets.APP_PORT }}" | Out-File -FilePath .env -Encoding utf8 -Append
          Write-Host ".env file created successfully" # Критерий 3

      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          Write-Host "Cleaning up old Docker resources to prevent cache errors..."
          docker system prune -f
          docker volume prune -f
          
          Write-Host "Force removing old containers to prevent conflicts..."
          docker rm -f app-db 2>$null
          docker rm -f app 2>$null
          
          Write-Host "Starting deployment..."
          docker compose down -v
          docker compose up -d --build # Критерий 2
          
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 15
          docker compose ps

      - name: Verify containers are running
        shell: powershell
        run: |
          $status = docker compose ps
          if ($status -match "Up") {
              Write-Host "All containers are running"
          } else {
              Write-Host "Some containers failed to start"
              docker compose logs
              exit 1
          } # Критерий 2

      - name: Run application tests
        shell: powershell
        run: |
          Write-Host "1. Testing application and database connectivity..."
          
          $apiResponse = (Invoke-WebRequest -Uri "http://localhost:${{ secrets.APP_PORT }}/api/items" -UseBasicParsing).Content
          
          if ($apiResponse -match "first item") {
              Write-Host "Web application is healthy and returns data from DB"
          } else {
              Write-Host "Web application API test failed. Response: $apiResponse"
              exit 1
          } # Критерий 4
          
          Write-Host "2. Testing data consistency..."
          
          $dbCountRaw = docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;"
          $dbCount = [int]($dbCountRaw.Trim())
          
          $webCount = ([regex]::Matches($apiResponse, '"id"')).Count
          
          Write-Host "Database count: $dbCount"
          Write-Host "Web API count: $webCount"
          
          if ($dbCount -eq $webCount) {
              Write-Host "Data consistency test passed!"
          } else {
              Write-Host "Data consistency test failed!"
              exit 1
          } # Критерий 4

      - name: Create test report
        if: always()
        shell: powershell
        run: |
          "# Deployment Test Report" | Out-File -FilePath test-report.md
          "- Application: Healthy" | Out-File -FilePath test-report.md -Append
          "- Database: Connected" | Out-File -FilePath test-report.md -Append
          "- Containers: Running" | Out-File -FilePath test-report.md -Append
          "Data Consistency: Passed" | Out-File -FilePath test-report.md -Append

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
          retention-days: 30 # Критерий 3

      - name: Save Docker logs
        if: always()
        shell: powershell
        run: |
          docker compose logs > deployment-logs.txt

      - name: Upload Docker logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: deployment-logs.txt
          retention-days: 30 # Критерий 3
